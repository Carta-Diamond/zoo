<!DOCTYPE html>
<html>
    <head>
        <title>CRUD - Madagascar</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    </head>

    <body>

        <header>
            <h1>Xoologico de Central Park</h1>
            <p>CRUD de animales de Madagascar</p>
        </header>

        <main>

            <!-- Formulario -->
            <section class="formulario">
                <h2>Agregar animal</h2>

                <form>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" placeholder="Ej. Alex">

                    <label for="especie">Especie:</label>
                    <input type="text" id="especie" placeholder="Ej. León">

                    <label for="edad">Edad:</label>
                    <input type="number" id="edad" placeholder="Ej. 10">

                    <label for="habitat">Hábitat:</label>
                    <input type="text" id="habitat" placeholder="Ej. Zoológico">

                    <button type="submit" class="btn-agregar">
                        Agregar animal
                    </button>
                </form>
            </section>

            <!-- Tabla -->
            <section class="tabla-container">
                <h2>Animales registrados</h2>

                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Especie</th>
                            <th>Edad</th>
                            <th>Hábitat</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>Alex</td>
                            <td>León</td>
                            <td>10</td>
                            <td>Zoológico</td>
                            <td>
                                <button class="btn-editar">Editar</button>
                                <button class="btn-eliminar">Eliminar</button>
                            </td>
                        </tr>

                        <tr>
                            <td>2</td>
                            <td>Marty</td>
                            <td>Cebra</td>
                            <td>10</td>
                            <td>Zoológico</td>
                            <td>
                                <button class="btn-editar">Editar</button>
                                <button class="btn-eliminar">Eliminar</button>
                            </td>
                        </tr>

                        <tr>
                            <td>3</td>
                            <td>Melman</td>
                            <td>Jirafa</td>
                            <td>12</td>
                            <td>Zoológico</td>
                            <td>
                                <button class="btn-editar">Editar</button>
                                <button class="btn-eliminar">Eliminar</button>
                            </td>
                        </tr>

                        <tr>
                            <td>4</td>
                            <td>Gloria</td>
                            <td>Hipopótamo</td>
                            <td>11</td>
                            <td>Zoológico</td>
                            <td>
                                <button class="btn-editar">Editar</button>
                                <button class="btn-eliminar">Eliminar</button>
                            </td>
                        </tr>

                        <tr>
                            <td>5</td>
                            <td>Skipper</td>
                            <td>Pingüino</td>
                            <td>8</td>
                            <td>Antártida</td>
                            <td>
                                <button class="btn-editar">Editar</button>
                                <button class="btn-eliminar">Eliminar</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </section>

        </main>

    </body>
</html>
