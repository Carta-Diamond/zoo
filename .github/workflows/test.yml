
name: Pruebas del CRUD

on:
  push:
    branches:
      - main
      - feature/test
  pull_request:
    branches:
      - main

jobs:
  pruebas:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: animales
          MYSQL_USER: usuario
          MYSQL_PASSWORD: "1234"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: usuario
      DB_PASSWORD: "1234"
      DB_NAME: animales

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crear las tablas
        run: |
          python -c "from persistance.db import crear_tabla; crear_tabla()"

      - name: Ejecutar pruebas
        run: |
          python -m pytest -v

      - name: Construir imagen Docker
        run: docker build -t zoo-app:ci .
