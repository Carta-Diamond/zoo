services:
  mysql:
    image: mysql:8.0
    container_name: mi_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: animales
      MYSQL_USER: usuario
      MYSQL_PASSWORD: 1234
    ports:
      - "9999:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: